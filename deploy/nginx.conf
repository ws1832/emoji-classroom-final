limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=client_connections:10m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn client_connections 16;
    location ~ ^/api/v1/base/(access_token|register|register-teacher)$ {
        limit_req zone=auth_requests burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
    }
    location /api/ {
        proxy_pass http://api:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location /healthz { proxy_pass http://api:9999; }
    location = /ai-stream/frames {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ai_browser http://ai-browser:9998;
        proxy_pass $ai_browser/frames;
        proxy_set_header Host $host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 25s;
        proxy_connect_timeout 3s;
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
