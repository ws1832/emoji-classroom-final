[project]
name = "vue-fastapi-admin"
version = "0.1.0"
description = "Vue Fastapi admin"
authors = [
    {name = "mizhexiaoxiao", email = "mizhexiaoxiao@gmail.com"},
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.0",
    "annotated-doc==0.0.6",
    "typing-inspection==0.4.2",
    "tortoise-orm==0.23.0",
    "pydantic==2.10.5",
    "email-validator==2.2.0",
    "pyjwt==2.15.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "black==26.10.1",
    "isort==5.13.2",
    "ruff==0.9.1",
    "loguru==0.7.3",
    "pydantic-settings==2.7.1",
    "argon2-cffi==25.1.0",
    "pydantic-core==2.27.2",
    "annotated-types==0.7.0",
    "setuptools==84.2.1",
    "uvicorn==0.34.0",
    "h11==0.16.0",
    "aerich==0.8.1",
    "aiosqlite==0.20.0",
    "asyncmy==0.2.18",
    "anyio==4.16.0",
    "argon2-cffi-bindings==21.2.0",
    "asyncclick==8.1.8",
    "certifi==2026.10.23",
    "cffi==2.0.0",
    "cryptography==50.0.2",
    "click==8.1.8",
    "dictdiffer==0.9.0",
    "dnspython==2.9.2",
    "fastapi-cli==0.0.7",
    "httpcore==1.0.9",
    "httptools==0.6.4",
    "httpx==0.28.1",
    "idna==3.20",
    "iso8601==2.1.0",
    "jinja2==3.1.6",
    "markdown-it-py==3.0.0",
    "markupsafe==3.0.2",
    "mdurl==0.1.2",
    "mypy-extensions==1.0.0",
    "orjson==3.13.0",
    "packaging==24.2",
    "pathspec==1.1.1",
    "platformdirs==4.3.6",
    "pycparser==2.22",
    "pygments==2.21.0",
    "pypika-tortoise==0.3.2",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.33",
    "pytz==2024.2",
    "pyyaml==6.0.2",
    "rich==13.9.4",
    "rich-toolkit==0.13.2",
    "shellingham==1.5.4",
    "sniffio==1.3.1",
    "starlette==1.10.0",
    "typer==0.15.1",
    "typing-extensions==4.16.0",
    "ujson==6.1.0",
    "watchfiles==1.0.4",
    "websockets==14.1",
    "pyproject-toml>=0.1.0",
    "uvloop==0.21.0 ; sys_platform != 'win32'",
]

[tool.black]
line-length = 120
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 120
lint.extend-select = []
lint.ignore = [
    "F403",
    "F405",
]

[tool.aerich]
tortoise_orm = "app.settings.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
